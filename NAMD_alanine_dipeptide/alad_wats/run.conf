set in_prefix $env(in_prefix)
set out_prefix $env(out_prefix)

# INPUT
paraTypeCharmm          on
parameters              components/ff/par_all36_prot.prm
parameters              components/ff/toppar_water_ions.str
structure               components/topo/alad-wats_cross-term.psf
coordinates             components/coor/alad-wats.pdb

bincoordinates          $in_prefix.coor
binvelocities           $in_prefix.vel
extendedSystem          $in_prefix.xsc

# OUTPUT
outputenergies          100
outputtiming            100
outputpressure          100
restartfreq             100
binaryoutput            yes
binaryrestart           yes
outputname              $out_prefix
restartname             $out_prefix
XSTFreq                 100
DCDfile                 $out_prefix.dcd
DCDfreq                 1
velDCDfile              $out_prefix.veldcd
velDCDfreq              1
DCDUnitCell             yes

# 1-4 NON-BONDED
exclude                 scaled1-4
1-4scaling              1.0

# CONSTANT-T
langevin                on    
langevinTemp            300.0
langevinDamping         1.0   

# CONSTANT-P
langevinPiston          on
langevinPistonTarget    1.01325 
langevinPistonPeriod    100.0 
langevinPistonDecay     50.0
langevinPistonTemp      300.0
langevinPistonBarrier   off
useGroupPressure        yes 

# PARTITIONING
splitpatch              hydrogen
hgroupcutoff            2.8
margin                  1.0

# LOAD-BALANCING
ldBalancer              hybrid
ldbPeriod               20000

# PBC
wrapAll                 on

# CUT-OFFS
switching               on
switchdist              10.0 
cutoff                  12.0 
pairlistdist            14.0 

# PME 
PME                     yes
PMETolerance            10e-6
PMEInterpOrder          6
PMEGridSpacing          1.0

# RESPA
timestep                2
fullElectFrequency      2  
nonbondedFreq           1
stepspercycle           20

# SHAKE
rigidbonds              all
rigidtolerance          1e-6
rigiditerations         400

# COM
commotion               no
zeroMomentum            yes

# COLVARS
colvars                 yes
colvarsConfig           run_cv.in
source                  "calc_colvar_forces_tcl.tcl"

run                     $env(nsteps)

